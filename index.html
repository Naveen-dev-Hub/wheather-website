<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Weather App</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="weather-box">

<h1>Weather App</h1>

<div class="search-box">

<input
type="text"
id="city"
placeholder="Enter City Name">

<button id="searchBtn">

<i class="fa-solid fa-magnifying-glass"></i>

</button>

</div>

<div id="weather">

<h2 id="cityName"></h2>

<p id="date"></p>

<div class="temp">

<h1 id="temperature"></h1>

<p id="description"></p>

</div>

<div class="details">

<div class="card">

<i class="fa-solid fa-water"></i>

<p>Humidity</p>

<h3 id="humidity"></h3>

</div>

<div class="card">

<i class="fa-solid fa-wind"></i>

<p>Wind</p>

<h3 id="wind"></h3>

</div>

<div class="card">

<i class="fa-solid fa-sun"></i>

<p>Sunrise</p>

<h3 id="sunrise"></h3>

</div>

<div class="card">

<i class="fa-solid fa-moon"></i>

<p>Sunset</p>

<h3 id="sunset"></h3>

</div>

</div>

</div>

<p id="error"></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
